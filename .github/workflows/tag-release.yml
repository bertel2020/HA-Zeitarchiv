name: Tag release

# Setzt bei jedem Push auf main, der die Version in manifest.json ändert,
# automatisch einen Git-Tag "vX.Y.Z" — mehr nicht, bewusst kein GitHub
# Release (siehe Projekt-Konvention: "Release" heißt hier nur Version +
# CHANGELOG.md bumpen). HACS erkennt neue Versionen für die
# Update-Benachrichtigung über genau diese Tags, ein Release-Objekt ist
# dafür nicht nötig.

on:
  push:
    branches: [main]
    paths:
      - custom_components/zeitarchiv/manifest.json

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version from manifest.json
        id: version
        run: |
          VERSION=$(jq -r '.version' custom_components/zeitarchiv/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag if new
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG existiert bereits, nichts zu tun."
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
